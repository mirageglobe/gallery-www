    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #fff; /* the page around the embedded frame */
      }
      /* the page around the gallery: name above, frame, one line below */
      .page {
        box-sizing: border-box;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.25rem 1rem;
        font-family: Georgia, "Times New Roman", serif;
        color: #111;
      }
      .page-header {
        text-align: center;
      }
      /* the wordmark: "open" in a soft grey italic, "gallery" upright and dark,
         then a short rule and "by alldaycity" in small capitals */
      .page-title {
        margin: 0;
        font-size: clamp(1.7rem, 4.5vw, 2.6rem);
        font-weight: 400;
        line-height: 1.1;
        letter-spacing: 0.16em;
        text-transform: lowercase;
      }
      .page-title .wm-open {
        font-style: italic;
        letter-spacing: 0.1em;
        color: #8a8a8a;
      }
      .page-rule {
        width: 2.5rem;
        height: 1px;
        margin: 0.95rem auto 0.7rem; /* clears the descender of the "g" in gallery */
        border: 0;
        background: #111;
      }
      .page-subtitle {
        margin: 0;
        font-size: 0.8rem;
        font-variant: small-caps;
        letter-spacing: 0.24em;
        color: #777;
      }
      /* "by alldaycity" links back to the main site; same quiet colour, a thin
         underline on hover and keyboard focus */
      .page-subtitle a {
        color: inherit;
        text-decoration: none;
      }
      .page-subtitle a:hover,
      .page-subtitle a:focus-visible {
        color: #111;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
      .page-footer {
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        color: #999;
        text-align: center;
      }
      .page-footer p {
        margin: 0;
      }
      /* the tip link: same quiet colour as the footer, darker with an underline
         on hover and keyboard focus, like the "by alldaycity" link above */
      .page-footer a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid #ddd;
      }
      .page-footer a:hover,
      .page-footer a:focus-visible {
        color: #111;
        border-bottom-color: #111;
      }
      /* the embedded gallery frame, centred; the component sizes itself inside
         it (see .virtual-gallery), up to 960x540 and never taller than 70% of the
         window, so the name and footer always fit */
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        width: min(100%, 960px);
        height: min(540px, 70vh);
      }
      /* shown only when javascript is off; the 3d scene cannot run without it */
      .no-js {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        color: #111; /* dark text, the page behind it is white */
        font-family: Georgia, serif;
        text-align: center;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CX5OROpt.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-_9Ae9rtx.css">
  </head>
  <body>
    <main class="page">
      <!-- "the gallery by alldaycity": change the name here, in the title and in og:title above -->
      <header class="page-header">
        <h1 class="page-title"><span class="wm-open">the</span> <span class="wm-gallery">gallery</span></h1>
        <hr class="page-rule" />
        <p class="page-subtitle">by <a href="https://alldaycity.com">alldaycity</a></p>
      </header>
      <div id="app"></div>
      <footer class="page-footer">
        <p>walk the room, then click a work for its details</p>
        <!-- personal tip link, same page as the forestorigin web preview uses -->
        <p>enjoying it? <a href="https://buymeacoffee.com/mirageglobe" target="_blank" rel="noopener">buy me a coffee</a></p>
        <!-- the alldaycity.com contact address (a porkbun forward) -->
        <p>
          for collaboration, or to open a virtual gallery of your own,
          <a href="mailto:hello@alldaycity.com?subject=the%20gallery">contact me</a>
        </p>
      </footer>
    </main>
    <noscript><p class="no-js">This gallery needs JavaScript to run. Please turn it on and reload.</p></noscript>
  </body>
</html>
